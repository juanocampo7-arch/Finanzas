window.importar = async function() {
  const btn = document.getElementById('btn-import');
  btn.disabled = true;
  const prog = document.getElementById('prog');
  prog.style.display = 'block';
  log(`<span class="info">Subiendo ${movimientos.length} movimientos...</span>`);
  let ok = 0, err = 0;
  for(let i = 0; i < movimientos.length; i++) {
    try {
      await addDoc(collection(db, 'movimientos'), { ...movimientos[i], creadoEn: new Date().toISOString() });
      ok++;
      if(ok % 15 === 0) log(`✓ ${ok} registros subidos...`, 'ok');
    } catch(e) { err++; log(`✗ Error: ${e.message}`, 'err'); }
    prog.value = Math.round((i+1)/movimientos.length*100);
  }
  log(`<span class="ok">✅ ${ok} movimientos importados!</span>`);
  btn.textContent = '✅ Listo';
};

window.importarDeudas = async function() {
  const btn = document.getElementById('btn-deudas');
  btn.disabled = true;
  log(`<span class="info">Subiendo ${deudas.length} deudas pendientes...</span>`);
  let ok = 0;
  for(const d of deudas) {
    try {
      await addDoc(collection(db, 'deudas'), { ...d, pagada: false, creadoEn: new Date().toISOString() });
      ok++;
    } catch(e) { log(`✗ Error: ${e.message}`, 'err'); }
  }
  log(`<span class="ok">✅ ${ok} deudas importadas!</span>`);
  log(`<span class="warn">Ya puedes abrir la app principal.</span>`);
  btn.textContent = '✅ Deudas listas';
};

window.verificar = async function() {
  try {
    const m = await getDocs(collection(db, 'movimientos'));
    const d = await getDocs(collection(db, 'deudas'));
    log(`<span class="ok">📊 ${m.size} movimientos | ${d.size} deudas en Firebase</span>`);
  } catch(e) { log(`<span class="err">Error: ${e.message}</span>`); }
};
